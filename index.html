<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>術語卡 Term Cards</title>
  <meta name="description" content="整理課程與工作中遇到的英文專業術語：中文譯名、白話解釋與例句。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home">
  <a class="skip-link" href="#main">跳到主要內容</a>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="./">
        <span class="brand__mark" aria-hidden="true">Aa</span>
        <span class="brand__text">術語卡 <span class="brand__en">Term Cards</span></span>
      </a>
    </div>
  </header>

  <main id="main" class="wrap">
    <section class="hero">
      <h1 class="hero__title">英文專業術語，一張一張記起來</h1>
      <p class="hero__lead">每張卡有中文譯名、白話解釋與真實情境例句。進入主題後可以開啟「測驗模式」，只看英文、自己回想中文再翻卡。</p>

      <div class="search">
        <label class="visually-hidden" for="search">搜尋所有主題的術語</label>
        <input id="search" class="search__input" type="search" placeholder="搜尋所有術語（英文、縮寫或中文）" autocomplete="off" spellcheck="false" disabled>
        <kbd class="search__hint" aria-hidden="true">/</kbd>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">載入中…</p>

    <section id="results" class="results" aria-label="搜尋結果" hidden></section>
    <section id="topics" class="topic-grid" aria-label="主題列表"></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>內容寫在 <code>topics/*.json</code>，畫面由同一份程式產生。</p>
    </div>
  </footer>

  <noscript><p class="wrap status status--error">這個網站需要啟用 JavaScript 才能顯示術語卡。</p></noscript>
  <script src="assets/app.js" defer></script>
</body>
</html>
