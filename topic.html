<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>術語卡 Term Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="topic">
  <a class="skip-link" href="#main">跳到主要內容</a>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="./">
        <span class="brand__mark" aria-hidden="true">Aa</span>
        <span class="brand__text">術語卡 <span class="brand__en">Term Cards</span></span>
      </a>
      <a class="back-link" href="./">← 所有主題</a>
    </div>
  </header>

  <main id="main" class="wrap">
    <section id="topic-header" class="topic-header" hidden>
      <p class="topic-header__en" id="topic-en"></p>
      <h1 class="topic-header__title" id="topic-zh"></h1>
      <p class="topic-header__desc" id="topic-desc"></p>
      <p class="topic-header__meta" id="topic-meta"></p>
    </section>

    <section id="toolbar" class="toolbar" aria-label="工具列" hidden>
      <div class="search search--compact">
        <label class="visually-hidden" for="search">搜尋這個主題的術語</label>
        <input id="search" class="search__input" type="search" placeholder="搜尋術語、中文或解釋" autocomplete="off" spellcheck="false">
        <kbd class="search__hint" aria-hidden="true">/</kbd>
      </div>
      <div class="toolbar__actions">
        <button id="quiz-toggle" class="btn btn--toggle" type="button" aria-pressed="false">測驗模式</button>
        <button id="quiz-shuffle" class="btn" type="button" hidden>打亂順序</button>
        <button id="quiz-reset" class="btn" type="button" hidden>全部蓋回</button>
      </div>
      <p id="quiz-progress" class="toolbar__progress" aria-live="polite" hidden></p>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">載入中…</p>

    <section id="cards" class="card-list" aria-label="術語卡"></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p><a href="./">回到所有主題</a></p>
    </div>
  </footer>

  <noscript><p class="wrap status status--error">這個網站需要啟用 JavaScript 才能顯示術語卡。</p></noscript>
  <script src="assets/app.js" defer></script>
</body>
</html>
